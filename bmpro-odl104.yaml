
# YAML for monitoring a BMPro RV Battery system fitted with an ODL104 CAN to BLE Gateway
# You can use a BLE Scanner app on your phone to find the Bluetooth MAC Address of your ODL104 and then place it in the substitutions section below
#  or I believe the MAC address may be shown when you first pair the ODL104 with your phone 

# NOTE I used secrets for my API Encryption key and OTA passowrd - you will have to adjust accordingly

# IMPORTANT - place the Bluetooth MAC Address of your ODL104 here!!
substitutions:
  ODL104_Mac_Addr: "YOUR_ODL104_MAC_ADDR_HERE"  # format is "XX:XX:XX:XX:XX:XX"

esphome:
  name: odl104
  friendly_name: ODL104

esp32:
  board: esp32dev
  variant: esp32
  framework:
    type: esp-idf  

# Enable logging
logger:   

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

# Enable OTA updates
ota:
  - platform: esphome
    password: !secret ota_password 

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# It's nice to be able to reboot your ESP32 remotely :)
button:
  - platform: restart
    name: "Reboot ESP32"    

esp32_ble_tracker:
  scan_parameters:
    active: true

# The connection hub
ble_client:
  - mac_address: ${ODL104_Mac_Addr}   
    id: odl104

