substitutions:
  ODL104_Mac_Addr: "EC:E6:7B:E2:0F:A4"
  name: "odl104"
  friendly_name: "ODL104"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}" 

esp32:
  board: esp32dev
  variant: esp32
  framework:
    type: esp-idf

# Enable logging
logger:
#  level: DEBUG
  level: INFO

# Enable Home Assistant API
api:
  encryption:
    key: !secret  api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password 

wifi:
  networks:
  - ssid: !secret wifi_starlink_ssid
    password: !secret wifi_starlink_password
  - ssid: !secret wifi_ssid
    password: !secret wifi_password
    manual_ip:
      static_ip: 192.168.7.204
      gateway: 192.168.7.254
      subnet: 255.255.255.0
      dns1: 192.168.7.254  

# It's nice to be able to reboot your ESP32 remotely :)
button:
  - platform: restart
    name: "Reboot ESP32"    

esp32_ble_tracker:
  scan_parameters:
    active: true

# The connection hub
ble_client:
  - mac_address: ${ODL104_Mac_Addr}   
    id: odl104
    on_connect:
      then:
        - logger.log: "Connected to BLE Device! Reading data..."
#        - text_sensor.template.publish:
#            id: ble_status
#            state: "connected"
        # 1. Add a small delay to ensure GATT services are discovered
        - delay: 200ms
        - component.update: ble_auth 
    on_disconnect:
      then:
        - logger.log: "Disconnected from BLE Device! Reading data..."
#        - text_sensor.template.publish:
#            id: ble_status
#            state: "disconnected"        

sensor:
  - platform: wifi_signal
    name: "WiFi Signal Strength"
    update_interval: 60s 

# Comment this out once we're happpy
  - platform: template
    name: "Heartbeat"
    id: heartbeat 
    internal: true                  # after testing, make it an internal sensor so it is not sent to HASS
    unit_of_measurement: "s"
    device_class: duration    
    state_class: total_increasing
    filters:
    - delta: 10
    - heartbeat: 10s

  - platform: template
    name: "Battery Current"
    #Reg 0x61
    id: battery_current 
    unit_of_measurement: "A"
    device_class: current
    accuracy_decimals: 3
    filters:
    - delta: 0.03
    - heartbeat: 5min

  - platform: template
    name: "Battery Voltage"
    #Reg 0x62
    id: battery_voltage
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 2
    filters:
    - delta: 0.05
    - heartbeat: 5min

  - platform: template
    name: "Aux Current"
    #Reg 0x63
    id: aux_current
    unit_of_measurement: "A"
    device_class: current
    accuracy_decimals: 3 
    filters:
    - delta: 0.03
    - heartbeat: 5min

  - platform: template
    name: "reg 0x64"
    #Reg 0x64
    id: reg_64
    state_class: "measurement"
    filters:
    - delta: 0.05
    - heartbeat: 5min
#    unit_of_measurement: "V"
#    device_class: voltage
#    accuracy_decimals: 2

  - platform: template
    name: "Solar Voltage"
    #Reg 0x65
    id: solar_voltage
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 2
    filters:
    - delta: 0.05
    - heartbeat: 5min

  - platform: template
    name: "Battery Level"
    #Reg 0x66
    id: battery_pct
