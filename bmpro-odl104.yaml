globals:
  - id: auth_resp
    restore_value: no
    type: "uint8_t[4]"
    initial_value: '{0x00, 0x00, 0x00, 0x00}'   

text_sensor:
  - platform: template
    name: "Connection State"
    id: ble_status
 
  - platform: template
    # Just used for debug - seeing what else Reg 69 does
    name: "reg 0x6E"
    id: reg_6E  
  - platform: template
    # Just used for debug - seeing what else Reg 69 does
    name: "reg 0x6F"
    id: reg_6F  
  - platform: template
    # Just used for debug - seeing what else Reg 69 does
    name: "reg 0x70"
    id: reg_70  

# This internal "Sensor" is for BLE AUTH
  - platform: ble_client
    ble_client_id: odl104
    id: ble_auth
    internal: true
    service_uuid: '53455445-4320-434e-3130-310000000000'         # :) "SETEC CN101" 
    characteristic_uuid: 'ffffffff-ffff-5345-5445-432041555448'  # :) "SETEC AUTH"
    notify: true
    on_notify:
      then:
        - if:
            condition:          # The lambda returns true to run 'then', false to run 'else'
              lambda: |-
                // Convert the incoming string 'x' to an array...
                const uint8_t* data = (const uint8_t*) x.c_str();
                
                // Logs the vector with a space between bytes: 01 02 03 04 aa bb
                std::vector<uint8_t> logdata(x.begin(), x.end());
                ESP_LOGI("custom", "Auth Req: %s", esphome::format_hex_pretty(logdata).c_str());

                // return true if it was an Auth Request
                if (x.size() == 4) {    
                  // Response = Request ^ 0x43313078   ("C10x" ??)
                  // Use XOR to set our auth_resp global so it can be used in the "THEN"
                  id(auth_resp)[0] = (data[0] ^ 0x43);  
                  id(auth_resp)[1] = (data[1] ^ 0x31);  
                  id(auth_resp)[2] = (data[2] ^ 0x30);  
                  id(auth_resp)[3] = (data[3] ^ 0x78);  
                  return true;
                } else {
                  return false; 
                } 
            then:
              - ble_client.ble_write:
                  id: odl104
                  service_uuid: "53455445-4320-434e-3130-310000000000"
                  characteristic_uuid: "ffffffff-ffff-5345-5445-432041555448"
                  #value: [0xed, 0x64, 0xbd, 0x05, 0x13, 0xef, 0xbf, 0xbd]
                  value: !lambda |-
                    std::vector<uint8_t> data;
                    // Loop through the global array 
                    for (int i = 0; i < 4; i++) {
                      data.push_back((uint8_t)id(auth_resp)[i]);
                    }
                    return data;                   
            else:
              - logger.log: "Authenticated..."
#              lambda: |-
#                // reflect the response in our ble_status sensor
#                id(ble_status).publish_state(x);
           
# This internal "Sensor" just listend to the heartbeat to check the connection is alive
  - platform: ble_client
    ble_client_id: odl104
    id: ble_heartbeat
    internal: true
    service_uuid: '53455445-4320-434e-3130-310000000000'         # :) "SETEC CN101" 
    characteristic_uuid: 'FFFFFF42-4C45-2048-4541-525442454154'  # :) "BLE HEARTBEAT"
    notify: false          # <-- Only noyify during testing
    on_notify:
      then:
        - lambda: |-
            // convert our incoming string into a byte array
            const uint8_t* data = (const uint8_t*) x.c_str();
            if (x.size() < 3) return;   // abort if the data is too short
            id(heartbeat).publish_state(((int16_t)data[1] << 8) | (int16_t)data[0] ); 

# This internal "Sensor" acts as the listener for notifications, then publishes the state of the above sensors accordingly
  - platform: ble_client
    ble_client_id: odl104
    id: ble_receiver
    internal: true
    service_uuid: '53455445-4320-434e-3130-310000000000'         # :) "SETEC CN101" 
    characteristic_uuid: 'ffffff53-4554-4543-2043-414e20424c45'  # :) "SETEC CAN BLE"
    notify: true
    on_notify:
      then:
        - lambda: |-
            // Logs the vector with a space between bytes: 01 02 03 04 aa bb
            std::vector<uint8_t> logdata(x.begin(), x.end());
            //ESP_LOGI("custom", "Reg data: %s", esphome::format_hex_pretty(logdata).c_str());

            // convert our incoming string into a byte array
            const uint8_t* data = (const uint8_t*) x.c_str();
            
            size_t n = x.size();

            if (n < 6) return;                   // abort if the data is too short

            uint8_t packet_type = data[0];
            if (!((packet_type == 0x14) || 
                  (packet_type == 0x16) ||  // Change-Of-State (Something else has changed a value - eg the BMPro app)
                  (packet_type == 0x18)
                  )) return;  // ignore other packet types (for now)

            uint8_t data_source = data[2];
            uint8_t reg_id = data[3];

            // if Data Source is BMPro...
            if (data_source == 0x40) {  
              int32_t val = 0;

              // if it's a digital output then bytes 6..9 hold the current (mAmps)
              if ((reg_id >= 0x40) && (reg_id <= 0x4D))
                val = ((int32_t)data[6] << 24) |
                      ((int32_t)data[7] << 16) | 
                      ((int32_t)data[8] << 8)  |  
                      (int32_t)data[9]; 

              switch (reg_id) {
                //-- some unknow registers - to investigate --//
                case 0x00: break;  // 7x bytes {41 42 53 30 39 00 32} = ASCII "ABS09_2" **NOTE arrived with packet_type = 0x14 NOTE**
                case 0x01: break;  // 8x bytes **NOTE arrived with packet_type = 0x14 NOTE** 
                case 0x0C: break;  // 1x byte  **NOTE arrived with packet_type = 0x14 NOTE**     
                case 0x0F: break;  // 8x bytes **NOTE arrived with packet_type = 0x14 NOTE** 
                case 0x10: break;  // 8x bytes **NOTE arrived with packet_type = 0x14 NOTE**   
                case 0x11: break;  // 8x bytes **NOTE arrived with packet_type = 0x14 NOTE**        
                case 0x13: break;  // 4x bytes **NOTE arrived with packet_type = 0x14 NOTE**        

                case 0x40: 
                  id(output_1).publish_state(data[5] == 1);  // data[5] holds the binary state
                  id(output_1_current).publish_state(val / 1000.0); 
                  break;
                case 0x41: 
                  id(output_2).publish_state(data[5] == 1); 
                  id(output_2_current).publish_state(val / 1000.0); 
                  break;
                case 0x42: 
                  id(output_3).publish_state(data[5] == 1); 
                  id(output_3_current).publish_state(val / 1000.0); 
                  break;
                case 0x43: 
                  id(output_4).publish_state(data[5] == 1); 
                  id(output_4_current).publish_state(val / 1000.0); 
                  break;
                case 0x44: 
                  id(output_5).publish_state(data[5] == 1); 
                  id(output_5_current).publish_state(val / 1000.0); 
                  break;
                case 0x45: 
                  id(output_6).publish_state(data[5] == 1); 
                  id(output_6_current).publish_state(val / 1000.0); 
                  break;
                case 0x46: 
                  id(output_7).publish_state(data[5] == 1); 
                  id(output_7_current).publish_state(val / 1000.0); 
                  break;
                case 0x47: 
                  id(output_8).publish_state(data[5] == 1); 
                  id(output_8_current).publish_state(val / 1000.0); 
                  break;
                case 0x48: 
                  id(output_9).publish_state(data[5] == 1); 
                  id(output_9_current).publish_state(val / 1000.0); 
                  break;
                case 0x49: 
                  id(light_1).publish_state(data[5] == 1); 
                  id(light_1_current).publish_state(val / 1000.0); 
                  break;
                case 0x4A: 
                  id(light_2).publish_state(data[5] == 1); 
                  id(light_2_current).publish_state(val / 1000.0); 
                  break;
                case 0x4B: 
                  id(light_3).publish_state(data[5] == 1); 
                  id(light_3_current).publish_state(val / 1000.0); 
                  break;
                case 0x4C: 
                  id(pump_1).publish_state(data[5] == 1); 
                  id(pump_1_current).publish_state(val / 1000.0); 
                  break;
                case 0x4D: 
                  id(pump_2).publish_state(data[5] == 1); 
                  id(pump_2_current).publish_state(val / 1000.0); 
                  break;

                case 0x61: // Battery Current (mA)
                  // Reconstruct 4-byte Int (LSB at data[8], MSB at data[5])
                  val = ((int32_t)data[5] << 24) | ((int32_t)data[6] << 16) | ((int32_t)data[7] << 8) | (int32_t)data[8];
                  id(battery_current).publish_state(val / 1000.0);
                  break;

                case 0x62: // Battery Voltage (mV)
                  val = ((int32_t)data[5] << 24) | ((int32_t)data[6] << 16) | ((int32_t)data[7] << 8) | (int32_t)data[8];
                  id(battery_voltage).publish_state(val / 1000.0);
                  break;

                case 0x63:   // Aux Current (mA)
                  val = ((int32_t)data[5] << 24) | ((int32_t)data[6] << 16) | ((int32_t)data[7] << 8) | (int32_t)data[8];
                  id(aux_current).publish_state(val / 1000.0);
                  break;

                case 0x64:  // Unknown - 4x bytes 0x00000000 (00000000) Looks like a 4x byte iteger  
                  val = ((int32_t)data[5] << 24) | ((int32_t)data[6] << 16) | ((int32_t)data[7] << 8) | (int32_t)data[8];
                  id(reg_64).publish_state(val);
                  break;

                case 0x65:  // solar volts - 4x bytes 0x00000000 (00000000) Looks like a 4x byte iteger as VOLTS  
                  val = ((int32_t)data[5] << 24) | ((int32_t)data[6] << 16) | ((int32_t)data[7] << 8) | (int32_t)data[8];
                  id(solar_voltage).publish_state(val / 1000.0);
                  break;

                case 0x66: // Battery %
                  val = ((int32_t)data[5] << 24) | ((int32_t)data[6] << 16) | ((int32_t)data[7] << 8) | (int32_t)data[8];
                  id(battery_pct).publish_state((float)val);
                  break;

                case 0x67: // Battery Runtime (mins)
                  val = ((int32_t)data[5] << 24) | ((int32_t)data[6] << 16) | ((int32_t)data[7] << 8) | (int32_t)data[8];
                  id(battery_runtime).publish_state((float)val);
                  break;

                case 0x68:  // Unknown - 4x bytes 0x7FFFFFFF (FFFFFF7F) Looks like a 4x byte iteger  
                  val = ((int32_t)data[5] << 24) | ((int32_t)data[6] << 16) | ((int32_t)data[7] << 8) | (int32_t)data[8];
                  id(reg_68).publish_state(val);
                  break;

                case 0x69: // various bits show status of stuff... 
                  id(eco_mode).publish_state((data[5] & 0x02) == 0x02); 
                  id(ac_supply).publish_state((data[6] & 0x01) == 0x01); 
                  id(aux_supply).publish_state((data[6] & 0x02) == 0x02); 
                  id(solar_supply).publish_state((data[6] & 0x08) == 0x08); 

                  // TEMP set Reg 69 for debugging 
                  val = ((int16_t)data[5] << 8) | (int16_t)data[6];
                  id(reg_69).publish_state(val);

                  break;

                case 0x6A:  // 300,000 - 4x bytes 0x000493E0 (E0930400) Looks like a 4x byte iteger could be mAmp-Hour battery size  
                  val = ((int32_t)data[5] << 24) | ((int32_t)data[6] << 16) | ((int32_t)data[7] << 8) | (int32_t)data[8];
                  id(battery_capacity).publish_state(val / 1000.0);
                  break;

                case 0x6B: // 256 - 4x bytes 0x00000100 (00010000) Looks like a 4x byte iteger could be Aux Voltage  
                  val = ((int32_t)data[5] << 24) | ((int32_t)data[6] << 16) | ((int32_t)data[7] << 8) | (int32_t)data[8];
                  id(aux_voltage).publish_state(val / 1000.0);
                  break;

                case 0x6C: // Load Current (mA)
                  val = ((int32_t)data[5] << 24) | ((int32_t)data[6] << 16) | ((int32_t)data[7] << 8) | (int32_t)data[8];
                  id(load_current).publish_state(val / 1000.0);
                  break;
                
                case 0x6D: // Supply Current (mA)
                  val = ((int32_t)data[5] << 24) | ((int32_t)data[6] << 16) | ((int32_t)data[7] << 8) | (int32_t)data[8];
                  id(ac_current).publish_state(val / 1000.0);
                  break;

                // some unknow registers - to investigate 
                case 0x6E: // NOTE arrived with packet_type = 0x14 NOTE  
                  id(reg_6E).publish_state(esphome::format_hex_pretty(logdata).c_str());
                  break;
                case 0x6F: // NOTE arrived with packet_type = 0x14 NOTE  
                  id(reg_6F).publish_state(esphome::format_hex_pretty(logdata).c_str());
                  break;
                case 0x70: // 1 byte data - unsure what it is ??
                  id(reg_70).publish_state(esphome::format_hex_pretty(logdata).c_str());
                  break;

                default:
                  std::vector<uint8_t> logdata(x.begin(), x.end());
                  ESP_LOGI("custom", "Unknown BMPro Reg: %s", esphome::format_hex_pretty(logdata).c_str());
                  break;              }    
            } 

            // if Data Source is ODL104  
            else if (data_source == 0x90){ 
              switch(reg_id) {
                //-- some unknow registers - to investigate --//
                case 0x00: break;  
                case 0x01: break;  
                case 0x0C: break;  
                case 0x0F: break;  
                case 0x10: break;  
                case 0x11: break;  
                case 0x13: break;  
                case 0x80: // Tank Levels, 1x byte per tank, values are 0 (0%) to 4 (100%) 
                  id(tank_1).publish_state(data[8] * 25.0);
                  id(tank_2).publish_state(data[7] * 25.0);
                  id(tank_3).publish_state(data[6] * 25.0);
                  id(tank_4).publish_state(data[5] * 25.0);
                  break;
                case 0x83: break;
                default:
                  std::vector<uint8_t> logdata(x.begin(), x.end());
                  ESP_LOGI("custom", "Unknown ODL104 Reg: %s", esphome::format_hex_pretty(logdata).c_str());
                  break;
              } 
            }
