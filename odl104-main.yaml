
# INCLUDE file for the BMPro ODL104 monitor

esp32_ble_tracker:
  scan_parameters:
    active: true

# The connection hub
ble_client:
  - mac_address: ${ODL104_Mac_Addr}   
    id: odl104
    on_connect:
      then:
        - logger.log: "Connected to BLE Device!"
        - text_sensor.template.publish:
            id: ble_status
            state: "Connected"
        # 1. Add a small delay to ensure GATT services are discovered
        - delay: 200ms
        - component.update: ble_auth # NOTE: This sensor is defined in odl104-auth.yaml 
    on_disconnect:
      then:
        - logger.log: "Disconnected from BLE Device!"
        - text_sensor.template.publish:
            id: ble_status           # NOTE: This sensor is defined in odl104-auth.yaml 
            state: "Disconnected"        

# default filter values macro for our odl104 sensors
.template_sensor: &sensor_filter
  filters:
  - delta: 0.05
  - heartbeat:
      period: 15min
      optimistic: true

sensor:
  - platform: template
    name: "Battery Current"
    #Reg 0x61
    id: battery_current 
    unit_of_measurement: "A"
    device_class: current
    accuracy_decimals: 3
    <<: *sensor_filter

  - platform: template
    name: "Battery Voltage"
    #Reg 0x62
    id: battery_voltage
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 2
    <<: *sensor_filter

  - platform: template
    name: "Aux Current"
    #Reg 0x63
    id: aux_current
    unit_of_measurement: "A"
    device_class: current
    accuracy_decimals: 3 
    <<: *sensor_filter

