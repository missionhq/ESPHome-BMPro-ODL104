    name: "External Temperature"
    id: ext_temp
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    accuracy_decimals: 1
    filters:
    - delta: 0.5
    - heartbeat:
        period: 15min
        optimistic: true

  - platform: template
    name: "Internal Temperature"
    id: int_temp
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    accuracy_decimals: 1
    filters:
    - delta: 0.5
    - heartbeat:
        period: 15min
        optimistic: true

  - platform: template
    name: "SmartTemp 1 Temperature"
    id: smarttemp1_temp
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    accuracy_decimals: 1
    filters:
      # 1. First, smooth the rapid fluctuations
      - sliding_window_moving_average:
          window_size: 10
          send_every: 1
      # 2. Then, only send update if change is significant (reduces chatter)
      - delta: 1
      # 3. Or every 15 mins
      - heartbeat:
          period: 15min
          optimistic: true      

  - platform: template
    name: "SmartTemp 1 Battery Level"
    id: smarttemp1_battery
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: battery
    #<<: *sensor_filter   
    filters:
      - calibrate_linear:
          method: least_squares
          datapoints:
            # Map battery Readings 71 (from sensor) to 2% (true value)
            - 71 -> 2
            - 178 -> 91 
            - 208 -> 100
      - delta: 1
      - heartbeat:
          period: 15min
          optimistic: true      

  - platform: template
    name: "SmartTemp 1 Signal Strength"
    id: smarttemp1_rssi    
    device_class: "signal_strength"  
    state_class: "measurement"
    unit_of_measurement: "dBm"
    accuracy_decimals: 0
    filters:
      # 1. First, smooth the rapid fluctuations
      - sliding_window_moving_average:
          window_size: 10
          send_every: 1
      # 2. Then, only send update if change is significant (reduces chatter)
      - delta: 1
      # 3. Or every 15 mins
