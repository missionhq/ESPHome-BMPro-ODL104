text_sensor:
  # Connection State - is also used by odl104-auth.yaml to reflect the authentication status
  - platform: template
    name: "Connection State"
    id: ble_status

  # This internal "Sensor" acts as the listener for notifications, then publishes the state of the above sensors accordingly
  - platform: ble_client
    ble_client_id: odl104
    id: ble_receiver
    internal: true
    service_uuid: '53455445-4320-434e-3130-310000000000'         # :) "SETEC CN101" 
    characteristic_uuid: 'ffffff53-4554-4543-2043-414e20424c45'  # :) "SETEC CAN BLE"
    notify: true
    on_notify:
      then:
        - lambda: |-
            // Logs the vector with a space between bytes: 01 02 03 04 aa bb
            std::vector<uint8_t> logdata(x.begin(), x.end());
            //ESP_LOGI("custom", "Reg data: %s", esphome::format_hex_pretty(logdata).c_str());

            // convert our incoming string into a byte array
            const uint8_t* data = (const uint8_t*) x.c_str();
            
            size_t n = x.size();
            if (n < 6) return;                   // abort if the data is too short

            uint8_t packet_type = data[0];
            if (!((packet_type == 0x14) ||  // Unsure ??
                  (packet_type == 0x16) ||  // Change-Of-State 
                  (packet_type == 0x18) ||  // Periodic Notification
                  (packet_type == 0x1C)     // Occured when we entered ECO mode
                  )){
              ESP_LOGI("custom", "Unknown Packet Type: %s", esphome::format_hex_pretty(logdata).c_str());
              return;  // ignore other packet types (for now)
            }

            uint8_t data_source = data[2];
            uint8_t reg_id = data[3];
            int32_t val = 0;

            // if Data Source is BMPro...
            if (data_source == 0x40) {  
              // if it's a digital output (reg 0x40..0x4D) then bytes 6..9 hold the current (mAmps)
              if ((reg_id >= 0x40) && (reg_id <= 0x4D))
                val = ((int32_t)data[6] << 24) |
                      ((int32_t)data[7] << 16) | 
                      ((int32_t)data[8] << 8)  |  
                       (int32_t)data[9]; 

              switch (reg_id) {
                //-- some unknow registers - to investigate --//
                //case 0x00: break;  // 7x bytes {41 42 53 30 39 00 32} = ASCII "ABS09_2" 
                //case 0x01: break;  // 8x bytes  
                //case 0x0C: break;  // 1x byte       
                //case 0x0F: break;  // 8x bytes  
                //case 0x10: break;  // 8x bytes   
                //case 0x11: break;  // 8x bytes        
                //case 0x13: break;  // 4x bytes         

                case 0x40: 
                  id(output_1).publish_state(data[5] == 1);  // data[5] holds the binary state
                  id(output_1_current).publish_state(val / 1000.0); 
                  break;
                case 0x41: 
                  id(output_2).publish_state(data[5] == 1); 
                  id(output_2_current).publish_state(val / 1000.0); 
                  break;
                case 0x42: 
                  id(output_3).publish_state(data[5] == 1); 
                  id(output_3_current).publish_state(val / 1000.0); 
                  break;
                case 0x43: 
                  id(output_4).publish_state(data[5] == 1); 
                  id(output_4_current).publish_state(val / 1000.0); 
                  break;
                case 0x44: 
                  id(output_5).publish_state(data[5] == 1); 
                  id(output_5_current).publish_state(val / 1000.0); 
                  break;
                case 0x45: 
                  id(output_6).publish_state(data[5] == 1); 
                  id(output_6_current).publish_state(val / 1000.0); 
                  break;
                case 0x46: 
                  id(output_7).publish_state(data[5] == 1); 
                  id(output_7_current).publish_state(val / 1000.0); 
                  break;
                case 0x47: 
                  id(output_8).publish_state(data[5] == 1); 
                  id(output_8_current).publish_state(val / 1000.0); 
                  break;
                case 0x48: 
                  id(output_9).publish_state(data[5] == 1); 
                  id(output_9_current).publish_state(val / 1000.0); 
                  break;
                case 0x49: 
                  id(light_1).publish_state(data[5] == 1); 
                  id(light_1_current).publish_state(val / 1000.0); 
                  break;
                case 0x4A: 
                  id(light_2).publish_state(data[5] == 1); 
                  id(light_2_current).publish_state(val / 1000.0); 
                  break;
                case 0x4B: 
                  id(light_3).publish_state(data[5] == 1); 
                  id(light_3_current).publish_state(val / 1000.0); 
                  break;
                case 0x4C: 
                  id(pump_1).publish_state(data[5] == 1); 
                  id(pump_1_current).publish_state(val / 1000.0); 
                  break;
                case 0x4D: 
                  id(pump_2).publish_state(data[5] == 1); 
                  id(pump_2_current).publish_state(val / 1000.0); 
                  break;

                case 0x61: // Battery Current (mA)
                  // Reconstruct 4-byte Int (LSB at data[8], MSB at data[5])
                  val = ((int32_t)data[5] << 24) | ((int32_t)data[6] << 16) | ((int32_t)data[7] << 8) | (int32_t)data[8];
                  id(battery_current).publish_state(val / 1000.0);
                  break;

                case 0x62: // Battery Voltage (mV)
                  val = ((int32_t)data[5] << 24) | ((int32_t)data[6] << 16) | ((int32_t)data[7] << 8) | (int32_t)data[8];
                  id(battery_voltage).publish_state(val / 1000.0);
                  break;

                case 0x63:   // Aux Current (mA)
                  val = ((int32_t)data[5] << 24) | ((int32_t)data[6] << 16) | ((int32_t)data[7] << 8) | (int32_t)data[8];
                  id(aux_current).publish_state(val / 1000.0);
                  break;

                case 0x64:   // Solar Current (mA)
                  val = ((int32_t)data[5] << 24) | ((int32_t)data[6] << 16) | ((int32_t)data[7] << 8) | (int32_t)data[8];
                  id(solar_current).publish_state(val / 1000.0);
                  break;
                  
                case 0x65:  // solar volts - 4x bytes 0x00000000 (00000000) Looks like a 4x byte iteger as VOLTS  
                  val = ((int32_t)data[5] << 24) | ((int32_t)data[6] << 16) | ((int32_t)data[7] << 8) | (int32_t)data[8];
                  id(solar_voltage).publish_state(val / 1000.0);
                  break;

                case 0x66: // Battery %
                  val = ((int32_t)data[5] << 24) | ((int32_t)data[6] << 16) | ((int32_t)data[7] << 8) | (int32_t)data[8];
                  id(battery_pct).publish_state((float)val);
                  break;

                case 0x67: // Battery Runtime (mins)
                  val = ((int32_t)data[5] << 24) | ((int32_t)data[6] << 16) | ((int32_t)data[7] << 8) | (int32_t)data[8];
                  id(battery_runtime).publish_state((float)val);
                  break;

                case 0x69: // various bits show status of stuff... 
                  id(eco_mode).publish_state((data[5] & 0x02) == 0x02); 
                  id(ac_supply).publish_state((data[6] & 0x01) == 0x01); 
                  id(aux_supply).publish_state((data[6] & 0x02) == 0x02); 
                  id(solar_supply).publish_state((data[6] & 0x08) == 0x08); 
                  break;

                case 0x6A:  // 300,000 - 4x bytes 0x000493E0 (E0930400) Looks like a 4x byte iteger could be mAmp-Hour battery size  
                  val = ((int32_t)data[5] << 24) | ((int32_t)data[6] << 16) | ((int32_t)data[7] << 8) | (int32_t)data[8];
                  id(battery_capacity).publish_state(val / 1000.0);
                  break;

                case 0x6B: // 256 - 4x bytes 0x00000100 (00010000) Looks like a 4x byte iteger could be Aux Voltage  
                  val = ((int32_t)data[5] << 24) | ((int32_t)data[6] << 16) | ((int32_t)data[7] << 8) | (int32_t)data[8];
                  id(aux_voltage).publish_state(val / 1000.0);
                  break;

                case 0x6C: // Load Current (mA)
                  val = ((int32_t)data[5] << 24) | ((int32_t)data[6] << 16) | ((int32_t)data[7] << 8) | (int32_t)data[8];
                  id(load_current).publish_state(val / 1000.0);
                  break;
                
                case 0x6D: // Supply Current (mA)
                  val = ((int32_t)data[5] << 24) | ((int32_t)data[6] << 16) | ((int32_t)data[7] << 8) | (int32_t)data[8];
                  id(ac_current).publish_state(val / 1000.0);
                  break;

                default:
                  std::vector<uint8_t> logdata(x.begin(), x.end());
                  ESP_LOGI("custom", "Unknown BMPro Reg: %s", esphome::format_hex_pretty(logdata).c_str());
                  break;

              } //end switch  

            } //end if

            // if Data Source is ODL104  
            else if (data_source == 0x90){ 
              // ESP_LOGI("custom", "ODL104 Reg: %s", esphome::format_hex_pretty(logdata).c_str()); 
              switch(reg_id) {
                //-- some unknow registers - to investigate --//
                //case 0x00: break;  
                //case 0x01: break;  
                //case 0x0C: break;  
                //case 0x0F: break;  
                //case 0x10: break;  
                //case 0x11: break;  
                //case 0x13: break;  

                case 0x80: // Tank Levels, 1x byte per tank, values are 0 (0%) to 4 (100%) 
                  id(tank_1).publish_state(data[8] * 25.0);
                  id(tank_2).publish_state(data[7] * 25.0);
                  id(tank_3).publish_state(data[6] * 25.0);
                  id(tank_4).publish_state(data[5] * 25.0);
                  break;
                case 0x83:  // seems to be temperature sensors - internal and external probe
                  switch (data[5]){
                    case 0x01:
                      val = ((int32_t)data[8] << 8) | (int32_t)data[9];
                      id(int_temp).publish_state(val / 1000.0);
                      break;
                    case 0x02: 
                      val = ((int32_t)data[8] << 8) | (int32_t)data[9];
                      id(ext_temp).publish_state(val / 1000.0);
                      break;
                  }
                  break;
                default:
                  ESP_LOGI("custom", "Unknown ODL104 Reg: %s", esphome::format_hex_pretty(logdata).c_str());
                  break;

              } //end switch

            } //end if
            else
              ESP_LOGI("custom", "Unknown Device: %s", esphome::format_hex_pretty(logdata).c_str());            


# This internal "Sensor" is for SmartConnect sensors 
  - platform: ble_client
    ble_client_id: odl104
    id: ble_smart_connect
    internal: true
    service_uuid: '5e132000-73a9-4a6a-ae5f-c7bff0bd075e'         # :) "SETEC CN101" 
    characteristic_uuid: '5e132001-73a9-4a6a-ae5f-c7bff0bd075e'  
    notify: true          
    on_notify:
      then:
        - lambda: |-
            // Logs the vector with a space between bytes: 01 02 03 04 aa bb
            std::vector<uint8_t> logdata(x.begin(), x.end());
            ESP_LOGI("custom", "SmartConnect data: %s", esphome::format_hex_pretty(logdata).c_str());

            // convert our incoming string into a byte array
            const uint8_t* data = (const uint8_t*) x.c_str();
            
            size_t n = x.size();
            if (n < 2) return;                   // abort if the data is too short

            uint8_t packet_type = data[0];
            int temp = 0;

            switch(packet_type) {
              //case 0x00: break;
              //case 0x01: break;
              //case 0x02: break;
              //case 0x03: break;
              //case 0x04: break;
              //case 0x05: break;
              //case 0x06: break;
              //case 0x07: break;
              //case 0x08: break;
              //case 0x09: break;
              //case 0x0A: break;
              //case 0x0B: break;
              case 0x0C:  
                temp = data[11];
                id(smarttemp1_rssi).publish_state(temp - 255);              // 11th byte is SmartTemp1 RSSI
                id(smarttemp1_battery).publish_state(data[12]);             // 12th byte is SmartTemp1 Battery - see sensor filter for factor
                id(smarttemp1_temp).publish_state(data[13]);                // 13th byte is SmartTemp1 Temp
                id(smarttemp1_humidity).publish_state(data[14]);            // 14th byte is SmartTemp1 Humidity
                break;            
              default:
                ESP_LOGI("custom", "Unknown SmartConnect Pkt: %s", esphome::format_hex_pretty(logdata).c_str());
                break;            
            }



