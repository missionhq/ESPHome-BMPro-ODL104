# Example YAML for monitoring a BMPro RV Battery system fitted with an ODL104 CAN to BLE Gateway
# You can use a BLE Scanner app on your phone to find the Bluetooth MAC Address of your ODL104 and then place it in the substitutions section below
#  or I believe the MAC address may be shown when you first pair the ODL104 with your phone 

# NOTE I used secrets for my API Encryption key, OTA password and WiFi details - you will have to adjust accordingly

# IMPORTANT - place the Bluetooth MAC Address of your ODL104 here!!
substitutions:
  # MUST replace this MAC address with your ODL104 ble MAC address
  ODL104_Mac_Addr: "EC:E6:7B:E2:0F:A4"
  name: "odl104"
  friendly_name: "ODL104"
  board: esp32dev

# Include our proxy yaml
packages:   
  - !include odl104-auth.yaml 
  - !include odl104-main.yaml  
#  - !include odl104/odl104-heartbeat.yaml  # NOT NEEDED UNLESS YOU WANT TO TRACK THE HEARTBEAT AS A SENSOR IN ESPHOME

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: false
  
esp32:
  board: ${board}
  framework:
    type: esp-idf    

# Enable logging
logger:
  level: INFO

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password